name: Publish site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fails in seconds on a bad verdict value or a dangling cross-link,
      # rather than after a full render.
      - name: Validate the problem registry
        run: node tools/check-registry.mjs

      - name: Set up Quarto
        # Pinned so a Quarto release cannot silently change listing behavior.
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      # Pull requests get the build check without deploying.
      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
